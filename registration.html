<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <div class="we"><a href="index.html">
            <p class="wer">✈︎Skyticket</p>
        </a></div>
    <div class="register-box">
        <h2>Create Account</h2>
        <p>Join us and start your journey!</p>
        <form action="index.html">
            <label for="name">First Name</label>
            <input type="text" id="name" placeholder="Enter your first name" required>
            <label for="surname">Last Name</label>
            <input type="text" id="surname" placeholder="Enter your last name" required>
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password" required>
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Confirm your password" required>
            <button type="submit">Create Account</button>
        </form>
        <p class="login-link">
            Already have an account? <a href="giris.html">Log In</a>
        </p>
    </div>
</body>
</html>
