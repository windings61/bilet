<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact</title>
<style>
  body{background:#eef4fb;color:#223344;font-size:22px;line-height:1.8}
  h2{color:#0b4f9c;font-size:48px}
  h3{color:#0b4f9c;font-size:30px}
  input,select,textarea,button{font-size:20px;padding:8px}
  input,select,textarea{border:1px solid #9db8d6}
  button{background:#0b6bcb;color:#fff;border:0;padding:10px 30px;cursor:pointer}
</style>
</head>
<body>
<table align="center" width="1100" height="600" cellpadding="50" bgcolor="#ffffff" style="max-width:100%">
<tr><td valign="top">
<section id="contact">
  <h2>Contact</h2>
  <table cellpadding="6">
    <tr><td><b>Address:</b></td><td>Aspa, Baku</td></tr>
    <tr><td><b>Phone:</b></td><td>+994 50 211 11 11</td></tr>
    <tr><td><b>Email:</b></td><td>info@skyticket.az</td></tr>
    <tr><td><b>Working hours:</b></td><td>Mon – Fri, 09:00–18:00</td></tr>
  </table>
  <h3>Write to us</h3>
  <form id="contactForm">
    <table cellpadding="8">
      <tr>
        <td><label for="name">Full name</label></td>
        <td><input id="name" size="45" required></td>
      </tr>
      <tr>
        <td><label for="email">Email</label></td>
        <td><input id="email" type="email" size="45" required></td>
      </tr>
      <tr>
        <td><label for="subject">Subject</label></td>
        <td>
          <select id="subject">
            <option>Ticket booking</option>
            <option>Payment</option>
            <option>Cancellation and changes</option>
            <option>Other</option>
          </select>
        </td>
      </tr>
      <tr>
        <td valign="top"><label for="message">Message</label></td>
        <td><textarea id="message" rows="7" cols="45" required></textarea></td>
      </tr>
      <tr>
        <td></td>
        <td><button type="submit">Send</button></td>
      </tr>
    </table>
  </form>
</section>
</td></tr>
</table>

</body>
</html>
